name: 故障报告 / Bug report
description: 报告全文获取、下载核对、科研通或界面问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 SUPPORT.md。不要上传账号、密码、Cookie、完整文库/任务数据库、浏览器配置或受限 PDF；截图请遮挡个人信息。
        Please redact personal details. Do not attach credentials, cookies, a complete library, browser profiles, or restricted PDFs.
  - type: input
    id: versions
    attributes:
      label: 环境与版本 / Environment
      description: 操作系统、Zotero 版本、全文助手版本。
      placeholder: Windows 11; Zotero 10.0.7; Fulltext Assistant 0.8.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从哪个按钮开始、之后做了什么？请勿为复现反复付费求助或采纳。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
      description: 请说明任务状态、错误原文，以及下载检查详情中相关的结果。
    validations:
      required: true
  - type: input
    id: doi
    attributes:
      label: 可公开的 DOI 或论文网页 / Public DOI or article page
      description: 可选。不要提供私人求助链接、临时下载地址或带鉴权参数的网址。
  - type: textarea
    id: browser
    attributes:
      label: 浏览器中的情况 / Behavior in your browser
      description: 可选。日常浏览器能否下载？是否完成机构登录？PDF 是否保存到已配置目录？请勿提供个人目录全路径。
  - type: textarea
    id: screenshots
    attributes:
      label: 去除隐私的补充信息 / Redacted details
      description: 可选。截图或少量相关错误文字即可，首次反馈无需完整日志或 PDF。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开反馈确认 / Public report
      options:
        - label: 我已检查并去除凭据、Cookie、个人路径及其他隐私资料。 / I have removed secrets and personal data.
          required: true
