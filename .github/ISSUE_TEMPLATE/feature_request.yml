name: 功能建议 / Feature request
description: 提出具体的使用场景、流程或兼容性建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎使用简体中文、繁體中文或 English。请描述要完成的任务，不提供共享账号或私密文件。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你在完成什么任务？现在遇到了什么困难或重复操作？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为 / Proposed behavior
      description: 请说明理想操作和结果；如涉及网站，提供公开页面即可。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法 / Alternatives tried
      description: 可选，说明现有按钮或工作方式为什么未满足需求。
