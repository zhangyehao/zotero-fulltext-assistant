name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run model, adapter and interface tests
        run: npm test
      - name: Build and verify all release assets
        run: |
          python build.py --output dist
          python scripts/release.py verify-local --directory dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zotero-fulltext-assistant-${{ github.sha }}
          path: |
            dist/*.xpi
            dist/*-source.zip
            dist/updates.json
            dist/SHA256SUMS
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14
