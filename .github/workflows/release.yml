name: Prepare release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to prepare (for example v0.8.0)
        required: true
        type: string
      replace_draft_assets:
        description: Explicitly replace differing assets in this draft only
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build reproducible candidate assets
        run: python build.py --output dist
      - name: Prepare and byte-verify the draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPLACE_DRAFT_ASSETS: ${{ inputs.replace_draft_assets || 'false' }}
        run: |
          if [ "$REPLACE_DRAFT_ASSETS" = "true" ]; then
            python scripts/release.py prepare --tag "$RELEASE_TAG" --directory dist --replace-draft-assets
          else
            python scripts/release.py prepare --tag "$RELEASE_TAG" --directory dist
          fi

